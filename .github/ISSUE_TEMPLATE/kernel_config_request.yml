name: "Kernel Configuration request"
description: Ask Raspberry Pi to add a specific kernel configuration to the stnadard Raspberry Pi kernel
body:
- type: markdown
  attributes:
    value: |
      In order for a kernel configuration request to be granted, please consider the following.
    
      * The feature should be of use to the majority of our users
      * The feature should not increase the size of the image excessively
      * The feature should not impact performance, even on low end devices such as the Pi Zero or Pi1.
    
- type: textarea
  id: configuration
  attributes:
    label: What configuration woudl you like added?
    description: |
      Add a clear and concise description of the configuration item, including the define if known.
  validations:
    required: true

