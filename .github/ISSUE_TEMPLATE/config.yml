blank_issues_enabled: false
contact_links:
  - name: "⛔ Do you want to ask a technical question?"
    url: https://www.raspberrypi.org/forums
    about: "This GitHub tracker it is for reporting issues with the Raspberry Pi Linux kernel. If you have a question, then the Raspberry Pi forums are the best place to ask it."
  - name: "⛔ Problems with the Raspberry Pi OS distribution packages"
    url: https://github.com/RPi-Distro/repo
    about: "If you have problems with the Raspberry Pi OS distribution itself, please report them in the github.com/RPi-Distro/repo."
  - name: "⛔ Feedback and bug reporting for Raspberry Pi Pico and RP2040"
    url: https://github.com/raspberrypi/pico-feedback/issues
    about: "Any feedback, including bug reports for the Pico SDK, examples and documentation, can be reported here."
  - name: "⛔ Reporting problems with the libcamera camera applications for Raspberry Pi"
    url: https://github.com/raspberrypi/libcamera-apps/issues
    about: "If you have problems with the Raspberry Pi libcamera applications or the camera software stack, please report them here."
  - name: "⛔ Problems with the Raspberry Pi firmware"
    url: https://github.com/RPi-Distro/repo
    about: "Firmware would include problems with processor frequency setting, and other low level operations not handled by the Linux kernel"
  - name: "⛔ Problems with the Raspberry Pi documentation"
    url: https://github.com/raspberrypi/documentation/issues
    about: "If you have found problems with our documentation, please report them here"

